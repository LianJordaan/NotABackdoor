name: NotABackdoor
version: 1.0.0-beta.4
main: com.lian.notabackdoor.panel.NotABackdoorPlugin
api-version: '1.18'
commands:
  nab:
    description: Open the operator setup guide, or manage panel access from the server console.
    usage: /nab [setup|status]
permissions:
  notabackdoor.admin:
    description: Open the private NotABackdoor setup and status guide.
    default: op
