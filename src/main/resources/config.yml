config-version: 2

# The panel accepts connections only from this machine. Forward it with SSH:
# ssh -L 8127:127.0.0.1:8127 user@your-server
panel:
  bind: "127.0.0.1"
  port: 8127

# Set only after a dedicated HTTPS relay origin has been approved and deployed.
# Then `nab relay pair` needs no URL argument.
relay:
  origin: ""
